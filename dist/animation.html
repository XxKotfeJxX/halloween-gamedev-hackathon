<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween — animation layers</title><link rel="stylesheet" href="assets/animation.css"><style>
*{box-sizing:border-box}body{margin:0;background:#171811;color:#eae3cf;font:14px/1.6 monospace}main{max-width:1050px;padding:35px 25px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}h1{font:600 32px/1.2 sans-serif}label{display:block;margin-top:25px}select{display:block;margin-top:8px;background:#eae3cf;color:#171811;border:0;padding:10px 12px;font:inherit;min-width:240px}a{color:#c0cb65}.demo[data-light=off] .pumpkin-lit{animation:none;opacity:0}.demo[data-light=on] .pumpkin-lit{animation:none;opacity:1}.demo[data-screen=off] .crt-screen{display:none}.demo[data-screen=on] .screen-skull,.demo[data-screen=on] .crt-screen:after{animation:none}.demo[data-screen=on] .crt-screen:after{opacity:0}.demo[data-screen=glitch] .screen-skull{animation-duration:.7s}.demo[data-screen=glitch] .crt-screen:after{animation-duration:.7s}.demo .mascot-rig{max-width:420px}.demo[data-float=off] .mascot-rig{animation:none}@media(max-width:650px){main{grid-template-columns:1fr;gap:10px}.demo .mascot-rig{max-width:300px;order:2}}
</style><main class="demo" data-light="auto" data-screen="auto" data-float="on"><div><h1>Окремі шари. Незалежні анімації.</h1><p>Гарбуз, комп’ютер і вміст екрана анімуються окремо.</p><label>Світло гарбуза<select data-control="light"><option value="auto">Автоматичне блимання</option><option value="on">Світло увімкнене</option><option value="off">Світло вимкнене</option></select></label><label>Екран комп’ютера<select data-control="screen"><option value="auto">Автоматичні глічі</option><option value="on">Стабільне зображення</option><option value="off">Екран вимкнений</option><option value="glitch">Часті глічі для перевірки</option></select></label><label>Рух ілюстрації<select data-control="float"><option value="on">Увімкнений</option><option value="off">Вимкнений</option></select></label><p><a href="./">← До сайту</a></p></div><div class="mascot-rig" role="img" aria-label="Гарбуз Джека блимає на старому комп’ютері; на екрані глічить піксельний череп">
<img class="rig-layer pumpkin-dark" src="assets/pumpkin-dark.webp" alt="" width="1024" height="1536" fetchpriority="high">
<img class="rig-layer pumpkin-lit" src="assets/pumpkin-lit.webp" alt="" width="1024" height="1536" fetchpriority="high">
<img class="rig-layer computer-base" src="assets/computer-base.webp" alt="" width="1024" height="1536" fetchpriority="high">
<div class="crt-screen" aria-hidden="true"><img class="screen-skull" src="assets/screen-skull.png" alt="" width="384" height="384"><i class="scan-beam"></i></div>
</div></main><script>document.querySelectorAll("[data-control]").forEach(s=>s.addEventListener("change",()=>document.querySelector(".demo").dataset[s.dataset.control]=s.value))</script></html>
